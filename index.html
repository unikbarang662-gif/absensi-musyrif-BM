<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musyrif Dashboard - Absensi BM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #f0fdf4, #ccfbf1, #f0fdfa);
            min-height: 100vh;
        }
        .sidebar {
            background: linear-gradient(180deg, #0f766e, #0d9488, #14b8a6);
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .card {
            background: white;
            border-radius: 24px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .header {
            background: linear-gradient(135deg, #0f766e, #0d9488, #14b8a6, #2dd4bf);
            background-size: 300% 300%;
            animation: gradientBG 5s ease infinite;
            border-radius: 28px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .schedule-item {
            background: #f8fafc;
            border-left: 4px solid #14b8a6;
            border-radius: 16px;
            transition: all 0.3s;
        }
        .schedule-item:hover { transform: translateX(5px); background: #e0f2fe; }
        .badge-hadir { background: #10b981; padding: 5px 15px; border-radius: 20px; color: white; font-size: 12px; font-weight: bold; }
        .badge-sakit { background: #f59e0b; padding: 5px 15px; border-radius: 20px; color: white; font-size: 12px; font-weight: bold; }
        .badge-izin { background: #3b82f6; padding: 5px 15px; border-radius: 20px; color: white; font-size: 12px; font-weight: bold; }
        .btn-submit {
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            border-radius: 30px;
            transition: all 0.3s;
        }
        .btn-submit:hover { transform: scale(1.02); opacity: 0.9; }
        .stat-card {
            background: white;
            border-radius: 20px;
            border-bottom: 4px solid #14b8a6;
        }
    </style>
</head>
<body>
    <div class="fixed left-0 top-0 h-full w-72 sidebar text-white shadow-2xl z-20">
        <div class="p-6 border-b border-white/20">
            <div class="flex items-center gap-3"><i class="fas fa-calendar-check text-2xl"></i><span class="font-bold text-xl">Absensi BM</span></div>
            <div class="mt-4 p-3 bg-white/10 rounded-xl"><p class="text-xs text-white/70">Login sebagai</p><p class="font-bold" id="sidebarName"></p><p class="text-sm" id="sidebarAsrama"></p></div>
        </div>
        <nav class="mt-6 px-4">
            <a href="#" class="flex items-center px-4 py-3 bg-white/20 rounded-xl"><i class="fas fa-tachometer-alt w-6"></i><span class="ml-3">Dashboard</span></a>
            <a href="#" onclick="scrollToRiwayat()" class="flex items-center px-4 py-3 hover:bg-white/10 transition rounded-xl mt-2"><i class="fas fa-history w-6"></i><span class="ml-3">Riwayat Absensi</span></a>
            <a href="#" onclick="exportData()" class="flex items-center px-4 py-3 hover:bg-white/10 transition rounded-xl mt-2"><i class="fas fa-download w-6"></i><span class="ml-3">Export Data</span></a>
            <a href="#" onclick="logout()" class="flex items-center px-4 py-3 hover:bg-red-500/30 transition rounded-xl mt-10"><i class="fas fa-sign-out-alt w-6"></i><span class="ml-3">Keluar</span></a>
        </nav>
    </div>

    <div class="ml-72 p-6">
        <div class="header p-6 mb-6 text-white shadow-xl">
            <div class="flex justify-between items-center">
                <div><h1 class="text-3xl font-bold" id="welcomeMsg"></h1><div class="flex gap-4 mt-2"><span><i class="fas fa-clock mr-1"></i><span id="liveClock"></span></span><span><i class="fas fa-calendar mr-1"></i><span id="liveDate"></span></span></div></div>
                <i class="fas fa-user-circle text-5xl opacity-80"></i>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
            <div class="stat-card p-5"><div class="flex justify-between"><div><p class="text-gray-500">TOTAL HADIR</p><p class="text-3xl font-bold text-teal-600" id="totalHadir">0</p></div><i class="fas fa-check-circle text-teal-500 text-3xl"></i></div></div>
            <div class="stat-card p-5"><div class="flex justify-between"><div><p class="text-gray-500">TOTAL SAKIT</p><p class="text-3xl font-bold text-orange-500" id="totalSakit">0</p></div><i class="fas fa-thermometer-half text-orange-500 text-3xl"></i></div></div>
            <div class="stat-card p-5"><div class="flex justify-between"><div><p class="text-gray-500">TOTAL IZIN</p><p class="text-3xl font-bold text-blue-500" id="totalIzin">0</p></div><i class="fas fa-envelope text-blue-500 text-3xl"></i></div></div>
            <div class="stat-card p-5"><div class="flex justify-between"><div><p class="text-gray-500">PERSENTASE</p><p class="text-3xl font-bold text-purple-500" id="persentase">0%</p></div><i class="fas fa-chart-line text-purple-500 text-3xl"></i></div></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="card p-6"><h2 class="text-xl font-bold mb-4"><i class="fas fa-chart-line text-teal-500 mr-2"></i> GRAFIK KEHADIRAN</h2><canvas id="attendanceChart" height="200"></canvas><div class="flex justify-center gap-3 mt-4"><button onclick="changePeriod('daily')" id="btnDaily" class="px-4 py-2 bg-teal-500 text-white rounded-full text-sm">Harian</button><button onclick="changePeriod('weekly')" id="btnWeekly" class="px-4 py-2 bg-gray-200 rounded-full text-sm">Mingguan</button><button onclick="changePeriod('monthly')" id="btnMonthly" class="px-4 py-2 bg-gray-200 rounded-full text-sm">Bulanan</button></div></div>
            <div class="card p-6"><h2 class="text-xl font-bold mb-4"><i class="fas fa-chart-pie text-teal-500 mr-2"></i> STATISTIK</h2><canvas id="pieChart" height="200"></canvas></div>
        </div>

        <div class="card p-6 mb-6">
            <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold"><i class="fas fa-calendar-alt text-teal-500 mr-2"></i> JADWAL HARI INI</h2><div class="bg-teal-100 px-4 py-2 rounded-full font-bold" id="dayName"></div></div>
            <div id="scheduleContainer" class="space-y-3"></div>
        </div>

        <div class="card p-6 mb-6">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-clipboard-list text-teal-500 mr-2"></i> FORM ABSENSI</h2>
            <form id="absensiForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div><label class="block font-semibold mb-2">Kegiatan</label><select id="kegiatanSelect" class="w-full px-4 py-3 border rounded-2xl" required></select></div>
                    <div><label class="block font-semibold mb-2">Status</label><select id="statusSelect" class="w-full px-4 py-3 border rounded-2xl"><option value="Hadir">✅ Hadir</option><option value="Sakit">🤒 Sakit</option><option value="Izin">📝 Izin</option></select></div>
                </div>
                <div class="mb-4"><label class="block font-semibold mb-2">Foto (URL)</label><input type="url" id="fotoUrl" class="w-full px-4 py-3 border rounded-2xl"></div>
                <button type="submit" class="btn-submit w-full text-white font-bold py-3">Kirim Absensi</button>
            </form>
        </div>

        <div class="card p-6" id="riwayatSection">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-history text-teal-500 mr-2"></i> RIWAYAT ABSENSI</h2>
            <div style="overflow-x: auto;"><table class="w-full"><thead class="bg-teal-50"><tr><th class="p-3">No</th><th>Tanggal</th><th>Waktu</th><th>Kegiatan</th><th>Status</th><th>Foto</th></tr></thead><tbody id="riwayatBody"></tbody></table></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let attendanceChart, pieChart;
        let currentPeriod = 'daily';
        
        const jadwal = {
            'Senin': ['Membangunkan Santri (03:30-04:30)', 'Pendampingan Pengajian Subuh (04:30-05:45)', 'Menggobraki Sekolah (06:00-07:30)', 'Piket Kamar & Maghrib (16:30-17:30)', 'Pendampingan Dalail (18:00-19:30)', 'Tertibkan Tidur Malam (21:30-22:30)'],
            'Selasa': ['Membangunkan Santri (03:30-04:30)', 'Pendampingan Pengajian Subuh (04:30-05:45)', 'Menggobraki Sekolah (06:00-07:30)', 'Piket Kamar & Maghrib (16:30-17:30)', 'Muthola\'ah (19:30-20:30)', 'Tertibkan Tidur Malam (21:30-22:30)'],
            'Rabu': ['Membangunkan Santri (03:30-04:30)', 'Pendampingan Pengajian Subuh (04:30-05:45)', 'Menggobraki Sekolah (06:00-07:30)', 'Piket Kamar & Maghrib (16:30-17:30)', 'Muthola\'ah (19:30-20:30)', 'Tertibkan Tidur Malam (21:30-22:30)'],
            'Kamis': ['Membangunkan Santri (03:30-04:30)', 'Pendampingan Pengajian Subuh (04:30-05:45)', 'Menggobraki Sekolah (06:00-07:30)', 'Piket Kamar & Maghrib (16:30-17:30)', 'Pendampingan Tawasulan (21:00-23:30)', 'Tertibkan Tidur Malam (21:30-22:30)'],
            'Jumat': ['Membangunkan Santri (03:30-04:30)', 'Piket Kamar & Maghrib (16:30-17:30)', 'Tertibkan Tidur Malam (21:30-22:30)'],
            'Sabtu': ['Membangunkan Santri (03:30-04:30)', 'Pendampingan Pengajian Subuh (04:30-05:45)', 'Menggobraki Sekolah (06:00-07:30)', 'Piket Kamar & Maghrib (16:30-17:30)', 'Muthola\'ah (19:30-20:30)', 'Tertibkan Tidur Malam (21:30-22:30)'],
            'Minggu': ['Membangunkan Santri (03:30-04:30)', 'Pendampingan Pengajian Subuh (04:30-05:45)', 'Piket Kamar & Maghrib (16:30-17:30)', 'Muthola\'ah (19:30-20:30)', 'Tertibkan Tidur Malam (21:30-22:30)']
        };

        function init() {
            let userStr = localStorage.getItem('currentUser');
            if (!userStr) { window.location.href = 'index.html'; return; }
            currentUser = JSON.parse(userStr);
            if (currentUser.role !== 'musyrif') { window.location.href = 'dashboard-admin.html'; return; }
            document.getElementById('sidebarName').innerHTML = currentUser.name;
            document.getElementById('sidebarAsrama').innerHTML = `Asrama ${currentUser.asrama}`;
            document.getElementById('welcomeMsg').innerHTML = `Selamat datang, ${currentUser.name}`;
            updateClock();
            loadJadwal();
            loadRiwayat();
            updateStats();
            initCharts();
        }

        function updateClock() {
            let now = new Date();
            document.getElementById('liveClock').innerHTML = now.toLocaleTimeString('id-ID');
            document.getElementById('liveDate').innerHTML = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            setTimeout(updateClock, 1000);
        }

        function loadJadwal() {
            let days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            let today = days[new Date().getDay()];
            document.getElementById('dayName').innerHTML = today;
            let schedule = jadwal[today] || jadwal['Senin'];
            document.getElementById('scheduleContainer').innerHTML = schedule.map((item, i) => `<div class="schedule-item p-4 flex items-center gap-3"><div class="w-8 h-8 bg-teal-500 rounded-full flex items-center justify-center text-white">${i+1}</div><div><p class="font-semibold">${item}</p></div></div>`).join('');
            document.getElementById('kegiatanSelect').innerHTML = schedule.map(item => `<option value="${item}">${item}</option>`).join('');
        }

        function updateStats() {
            let riwayat = JSON.parse(localStorage.getItem('riwayatAbsensi')) || [];
            riwayat = riwayat.filter(r => r.musyrif === currentUser.name);
            let hadir = riwayat.filter(r => r.status === 'Hadir').length;
            let sakit = riwayat.filter(r => r.status === 'Sakit').length;
            let izin = riwayat.filter(r => r.status === 'Izin').length;
            let total = hadir + sakit + izin;
            document.getElementById('totalHadir').innerHTML = hadir;
            document.getElementById('totalSakit').innerHTML = sakit;
            document.getElementById('totalIzin').innerHTML = izin;
            document.getElementById('persentase').innerHTML = total > 0 ? Math.round((hadir/total)*100) + '%' : '0%';
        }

        function initCharts() { changePeriod('daily'); }

        function changePeriod(period) {
            currentPeriod = period;
            document.getElementById('btnDaily').className = period === 'daily' ? 'px-4 py-2 bg-teal-500 text-white rounded-full text-sm' : 'px-4 py-2 bg-gray-200 rounded-full text-sm';
            document.getElementById('btnWeekly').className = period === 'weekly' ? 'px-4 py-2 bg-teal-500 text-white rounded-full text-sm' : 'px-4 py-2 bg-gray-200 rounded-full text-sm';
            document.getElementById('btnMonthly').className = period === 'monthly' ? 'px-4 py-2 bg-teal-500 text-white rounded-full text-sm' : 'px-4 py-2 bg-gray-200 rounded-full text-sm';
            let labels, hadir, sakit, izin;
            if (period === 'daily') { labels = ['Sen','Sel','Rab','Kam','Jum','Sab','Min']; hadir = [14,16,15,13,17,12,11]; sakit = [2,1,3,2,1,4,2]; izin = [1,2,1,2,1,1,3]; }
            else if (period === 'weekly') { labels = ['Minggu 1','Minggu 2','Minggu 3','Minggu 4']; hadir = [85,88,92,90]; sakit = [8,6,5,4]; izin = [7,6,3,6]; }
            else { labels = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; hadir = [85,88,92,90,95,98,100,102,105,108,110,115]; sakit = [8,6,5,4,3,2,2,1,1,1,0,0]; izin = [7,6,3,6,2,0,0,0,0,0,0,0]; }
            if (attendanceChart) attendanceChart.destroy();
            attendanceChart = new Chart(document.getElementById('attendanceChart'), { type: 'line', data: { labels, datasets: [{ label: 'Hadir', data: hadir, borderColor: '#10b981', tension: 0.4, fill: true }, { label: 'Sakit', data: sakit, borderColor: '#f59e0b', tension: 0.4 }, { label: 'Izin', data: izin, borderColor: '#3b82f6', tension: 0.4 }] }, options: { responsive: true } });
            updatePie();
        }

        function updatePie() {
            let riwayat = JSON.parse(localStorage.getItem('riwayatAbsensi')) || [];
            riwayat = riwayat.filter(r => r.musyrif === currentUser.name);
            let hadir = riwayat.filter(r => r.status === 'Hadir').length || 50;
            let sakit = riwayat.filter(r => r.status === 'Sakit').length || 15;
            let izin = riwayat.filter(r => r.status === 'Izin').length || 10;
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('pieChart'), { type: 'doughnut', data: { labels: ['Hadir','Sakit','Izin'], datasets: [{ data: [hadir, sakit, izin], backgroundColor: ['#10b981','#f59e0b','#3b82f6'] }] }, options: { responsive: true } });
        }

        function loadRiwayat() {
            let riwayat = JSON.parse(localStorage.getItem('riwayatAbsensi')) || [];
            riwayat = riwayat.filter(r => r.musyrif === currentUser.name).reverse();
            let tbody = document.getElementById('riwayatBody');
            if (riwayat.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8">Belum ada data</td></tr>'; return; }
            tbody.innerHTML = riwayat.slice(0, 30).map((r, i) => `<tr class="border-b"><td class="p-3">${i+1}</td><td>${r.tanggal}</td><td>${r.waktu}</td><td style="font-size:13px">${r.kegiatan}</td><td><span class="${r.status === 'Hadir' ? 'badge-hadir' : r.status === 'Sakit' ? 'badge-sakit' : 'badge-izin'}">${r.status}</span></td><td>${r.fotoUrl && r.fotoUrl !== '-' ? `<a href="${r.fotoUrl}" target="_blank"><i class="fas fa-image text-teal-500"></i></a>` : '-'}</td></tr>`).join('');
        }

        document.getElementById('absensiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let now = new Date();
            let absensi = { id: Date.now(), musyrif: currentUser.name, asrama: currentUser.asrama, kegiatan: document.getElementById('kegiatanSelect').value, status: document.getElementById('statusSelect').value, fotoUrl: document.getElementById('fotoUrl').value || '-', waktu: now.toLocaleTimeString('id-ID'), tanggal: now.toLocaleDateString('id-ID') };
            let riwayat = JSON.parse(localStorage.getItem('riwayatAbsensi')) || [];
            riwayat.unshift(absensi);
            localStorage.setItem('riwayatAbsensi', JSON.stringify(riwayat));
            loadRiwayat(); updateStats(); updatePie();
            Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Absensi terkirim', timer: 1500, showConfirmButton: false });
            this.reset();
        });

        function scrollToRiwayat() { document.getElementById('riwayatSection').scrollIntoView({ behavior: 'smooth' }); }
        function exportData() { let riwayat = JSON.parse(localStorage.getItem('riwayatAbsensi')) || []; riwayat = riwayat.filter(r => r.musyrif === currentUser.name); let blob = new Blob([JSON.stringify(riwayat, null, 2)], { type: 'application/json' }); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `absensi_${currentUser.name}.json`; a.click(); Swal.fire('Berhasil', 'Data diekspor', 'success'); }
        function logout() { Swal.fire({ title: 'Keluar?', icon: 'question', showCancelButton: true }).then(res => { if(res.isConfirmed) { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; } }); }

        init();
    </script>
</body>
</html>
