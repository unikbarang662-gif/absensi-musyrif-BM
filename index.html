<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Absensi BM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar { background: linear-gradient(180deg, #0d9488 0%, #0f766e 100%); }
        .stat-card { transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
        .gradient-header { background: linear-gradient(135deg, #0d9488, #14b8a6, #99f6e4); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="fixed left-0 top-0 h-full w-64 sidebar text-white shadow-xl z-10 overflow-y-auto">
        <div class="p-6 border-b border-teal-700">
            <div class="flex items-center space-x-3"><i class="fas fa-crown text-2xl"></i><span class="font-bold text-lg">Admin Panel</span></div>
        </div>
        <nav class="mt-6">
            <a href="#" class="flex items-center px-6 py-3 bg-teal-700 bg-opacity-50"><i class="fas fa-tachometer-alt w-5"></i><span class="ml-3">Dashboard</span></a>
            <a href="#" onclick="showMusyrifManagement()" class="flex items-center px-6 py-3 hover:bg-teal-700 transition"><i class="fas fa-users w-5"></i><span class="ml-3">Kelola Musyrif</span></a>
            <a href="#" onclick="downloadPDF('asrama')" class="flex items-center px-6 py-3 hover:bg-teal-700 transition"><i class="fas fa-download w-5"></i><span class="ml-3">Download PDF Asrama</span></a>
            <a href="#" onclick="downloadPDF('individu')" class="flex items-center px-6 py-3 hover:bg-teal-700 transition"><i class="fas fa-file-pdf w-5"></i><span class="ml-3">Download PDF Individu</span></a>
            <a href="#" onclick="showSettings()" class="flex items-center px-6 py-3 hover:bg-teal-700 transition"><i class="fas fa-cog w-5"></i><span class="ml-3">Pengaturan</span></a>
            <a href="#" onclick="logout()" class="flex items-center px-6 py-3 hover:bg-teal-700 transition"><i class="fas fa-sign-out-alt w-5"></i><span class="ml-3">Logout</span></a>
        </nav>
    </div>

    <div class="ml-64 p-6">
        <div class="gradient-header rounded-2xl p-6 mb-6 text-white shadow-lg">
            <div class="flex justify-between items-center">
                <div><h1 class="text-3xl font-bold">Dashboard Admin</h1><p class="text-teal-100 mt-2" id="dateTime"></p></div>
                <i class="fas fa-user-shield text-5xl opacity-80"></i>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-2xl shadow-lg p-6 stat-card"><div class="flex items-center justify-between"><div><p class="text-gray-500 text-sm">HARI INI</p><p class="text-2xl font-bold" id="todayCount">0</p></div><i class="fas fa-calendar-day text-teal-500 text-3xl"></i></div></div>
            <div class="bg-white rounded-2xl shadow-lg p-6 stat-card"><div class="flex items-center justify-between"><div><p class="text-gray-500 text-sm">MINGGU INI</p><p class="text-2xl font-bold" id="weekCount">0</p></div><i class="fas fa-calendar-week text-teal-500 text-3xl"></i></div></div>
            <div class="bg-white rounded-2xl shadow-lg p-6 stat-card"><div class="flex items-center justify-between"><div><p class="text-gray-500 text-sm">BULAN INI</p><p class="text-2xl font-bold" id="monthCount">0</p></div><i class="fas fa-calendar-alt text-teal-500 text-3xl"></i></div></div>
            <div class="bg-white rounded-2xl shadow-lg p-6 stat-card"><div class="flex items-center justify-between"><div><p class="text-gray-500 text-sm">MUSYRIF AKTIF</p><p class="text-2xl font-bold" id="activeCount">13</p></div><i class="fas fa-user-check text-teal-500 text-3xl"></i></div></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-2xl shadow-lg p-6"><h2 class="text-xl font-bold mb-4"><i class="fas fa-chart-bar text-teal-500 mr-2"></i> PERFORM MUSYRIF</h2><canvas id="performChart" height="250"></canvas></div>
            <div class="bg-white rounded-2xl shadow-lg p-6"><h2 class="text-xl font-bold mb-4"><i class="fas fa-chart-line text-teal-500 mr-2"></i> GRAFIK KINERJA DETAIL</h2><canvas id="detailChart" height="250"></canvas></div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-6"><h2 class="text-xl font-bold mb-4"><i class="fas fa-database text-teal-500 mr-2"></i> SEMUA DATA ABSENSI</h2><div class="overflow-x-auto"><table class="w-full" id="allDataTable"><thead class="bg-teal-50"><tr><th class="px-4 py-2">No</th><th class="px-4 py-2">Tanggal</th><th class="px-4 py-2">Musyrif</th><th class="px-4 py-2">Asrama</th><th class="px-4 py-2">Kegiatan</th><th class="px-4 py-2">Status</th></tr></thead><tbody></tbody></table></div></div>
    </div>

    <script>
        let performChart, detailChart;
        
        function updateDateTime() { const now = new Date(); document.getElementById('dateTime').innerHTML = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
        
        function loadDashboard() {
            const riwayat = JSON.parse(localStorage.getItem('riwayatAbsensi')) || [];
            const today = new Date().toLocaleDateString('id-ID');
            const thisWeek = getWeekNumber(new Date());
            const thisMonth = new Date().getMonth();
            
            document.getElementById('todayCount').innerHTML = riwayat.filter(r => r.tanggal === today).length;
            document.getElementById('weekCount').innerHTML = riwayat.filter(r => getWeekNumber(new Date(r.tanggal.split('/').reverse().join('-'))) === thisWeek).length;
            document.getElementById('monthCount').innerHTML = riwayat.filter(r => new Date(r.tanggal.split('/').reverse().join('-')).getMonth() === thisMonth).length;
            
            loadCharts(riwayat);
            loadAllData(riwayat);
        }
        
        function getWeekNumber(date) { const d = new Date(date); d.setHours(0,0,0); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const week1 = new Date(d.getFullYear(),0,4); return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7); }
        
        function loadCharts(riwayat) {
            const musyrifs = ['Ali Mashuri', 'Ali Zahid', 'Imam Syafi\'i', 'Fattahilah', 'Brian Adi Waskito', 'Bima Julian'];
            const performData = musyrifs.map(m => riwayat.filter(r => r.musyrif === m && r.status === 'Hadir').length);
            
            if (performChart) performChart.destroy();
            performChart = new Chart(document.getElementById('performChart'), { type: 'bar', data: { labels: musyrifs, datasets: [{ label: 'Jumlah Hadir', data: performData, backgroundColor: '#0d9488', borderRadius: 8 }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } } } });
            
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'];
            const monthlyData = months.map((m,i) => riwayat.filter(r => new Date(r.tanggal.split('/').reverse().join('-')).getMonth() === i && r.status === 'Hadir').length);
            if (detailChart) detailChart.destroy();
            detailChart = new Chart(document.getElementById('detailChart'), { type: 'line', data: { labels: months, datasets: [{ label: 'Kehadiran per Bulan', data: monthlyData, borderColor: '#0d9488', backgroundColor: 'rgba(13,148,136,0.1)', fill: true, tension: 0.4 }] }, options: { responsive: true } });
        }
        
        function loadAllData(riwayat) {
            const tbody = document.querySelector('#allDataTable tbody');
            tbody.innerHTML = riwayat.slice(0, 50).map((r,i) => `<tr class="border-b"><td class="px-4 py-2">${i+1}</td><td class="px-4 py-2">${r.tanggal}</td><td class="px-4 py-2">${r.musyrif}</td><td class="px-4 py-2">${r.asrama || '-'}</td><td class="px-4 py-2">${r.kegiatan?.substring(0,30)}</td><td class="px-4 py-2"><span class="px-2 py-1 rounded-full text-xs ${r.status === 'Hadir' ? 'bg-green-100 text-green-700' : r.status === 'Sakit' ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'}">${r.status}</span></td></tr>`).join('');
        }
        
        function showMusyrifManagement() { alert('Fitur manajemen musyrif: Tambah musyrif dengan nama asrama, kamar, dan password.'); }
        function downloadPDF(type) { alert(`Download PDF ${type === 'asrama' ? 'per asrama' : 'per individu'} - Fitur akan segera hadir.`); }
        function showSettings() { alert('Pengaturan: Nama Pondok, Alamat, Pengasuh, Ketua Pondok, Logo.'); }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        
        setInterval(updateDateTime, 1000);
        loadDashboard();
    </script>
</body>
</html>
