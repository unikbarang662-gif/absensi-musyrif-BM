<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Tam-taman | Validasi Syarat Ujian - Madrasah Diniyah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2e1f 0%, #1a4d2e 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LOGIN PAGE */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a3d24, #0a2e1f);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.5s ease;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 48px;
            padding: 40px 35px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo { font-size: 55px; color: #1e8e3e; margin-bottom: 15px; }
        .login-card h1 { font-size: 32px; font-weight: 800; color: #1a5c3a; margin-bottom: 8px; }
        .login-card p { color: #6b8c7a; margin-bottom: 35px; font-size: 14px; }
        .input-field { margin-bottom: 22px; text-align: left; }
        .input-field label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c5a3e; font-size: 14px; }
        .input-field input { width: 100%; padding: 14px 18px; border: 2px solid #e0ebe4; border-radius: 30px; font-size: 15px; transition: all 0.3s; font-family: 'Inter', sans-serif; }
        .input-field input:focus { outline: none; border-color: #2ecc71; box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1); }
        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #27ae60, #1e8449); color: white; border: none; border-radius: 40px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; }

        /* MAIN APP */
        .app-container { display: none; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100%;
            background: linear-gradient(180deg, #0d331f 0%, #082615 100%);
            color: white;
            padding: 25px 0;
            transition: all 0.3s;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            transform: translateX(0);
        }

        .sidebar-header { padding: 0 20px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-header h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .sidebar-header p { font-size: 10px; opacity: 0.7; margin-top: 5px; }
        .nav-item { padding: 12px 20px; margin: 3px 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.3s; font-weight: 500; }
        .nav-item:hover { background: rgba(46, 204, 113, 0.2); }
        .nav-item.active { background: linear-gradient(135deg, #27ae60, #1e8449); }

        /* Mobile menu toggle */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 101;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 260px;
            padding: 20px 25px;
            min-height: 100vh;
            transition: all 0.3s;
        }

        /* Cards */
        .welcome-card { background: white; border-radius: 24px; padding: 20px 25px; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .datetime { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #27ae60, #2ecc71); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 25px; }
        .stat-card { border-radius: 20px; padding: 20px; transition: transform 0.3s; cursor: pointer; color: white; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card .icon { font-size: 32px; margin-bottom: 10px; }
        .stat-card h3 { font-size: 28px; font-weight: 800; }
        .chart-container { background: white; border-radius: 24px; padding: 20px; margin-bottom: 25px; }
        canvas { max-height: 260px; width: 100%; }

        /* Data Cards */
        .data-card { background: white; border-radius: 24px; padding: 20px; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .btn-primary { background: linear-gradient(135deg, #27ae60, #1e8449); color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .btn-warning { background: #f39c12; color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .btn-secondary { background: #95a5a6; color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px; background: #f0faf4; color: #1a5c3a; font-weight: 700; }
        td { padding: 10px 12px; border-bottom: 1px solid #eef2ef; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .status-selesai { background: #d4edda; color: #155724; }
        .status-belum { background: #f8d7da; color: #721c24; }

        /* Kelas Container */
        .kelas-container { background: white; border-radius: 24px; padding: 20px; margin-bottom: 20px; }
        .kelas-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .kelas-title { font-size: 18px; font-weight: 700; color: #1a5c3a; }
        .mapel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 15px 0; }
        .mapel-check { background: #f8faf8; padding: 8px 12px; border-radius: 25px; display: flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid #e0ebe4; font-size: 13px; }
        .mapel-check input { width: 16px; height: 16px; cursor: pointer; accent-color: #27ae60; }

        /* Santri item clickable */
        .santri-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .santri-item:hover { background: #e8f5e9; }
        .santri-name { font-weight: 500; }
        .search-input { width: 100%; max-width: 300px; padding: 10px 16px; border: 2px solid #e0ebe4; border-radius: 30px; margin-bottom: 15px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; border-radius: 28px; padding: 25px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #1a5c3a; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 2px solid #e0ebe4; border-radius: 16px; font-family: 'Inter', sans-serif; }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { transform: translateX(-100%); width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 60px 15px 20px 15px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stat-card { padding: 15px; }
            .stat-card h3 { font-size: 22px; }
            .datetime { font-size: 16px; }
            .welcome-card { padding: 15px; }
            .kelas-header { flex-direction: column; align-items: flex-start; }
            .mapel-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .btn-primary, .btn-secondary { padding: 8px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-overlay">
    <div class="login-card">
        <div class="login-logo"><i class="fas fa-book-quran"></i></div>
        <h1>Tam-taman</h1>
        <p>Validasi Syarat Keikutsertaan Ujian<br>Madrasah Diniyah</p>
        <div class="input-field"><label><i class="fas fa-user"></i> Username</label><input type="text" id="username" value="admin"></div>
        <div class="input-field"><label><i class="fas fa-lock"></i> Password</label><input type="password" id="password" value="admin123"></div>
        <button class="login-btn" onclick="login()"><i class="fas fa-arrow-right-to-bracket"></i> Masuk Dashboard</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="appContainer" class="app-container">
    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h2><i class="fas fa-book-quran"></i> <span>Tam-taman</span></h2><p><span>Madrasah Diniyah</span></p></div>
        <div class="nav-item active" onclick="changeTab('dashboard')"><i class="fas fa-chart-line"></i> <span>Dashboard</span></div>
        <div class="nav-item" onclick="changeTab('santri')"><i class="fas fa-users"></i> <span>Data Santri</span></div>
        <div class="nav-item" onclick="changeTab('validasi')"><i class="fas fa-check-double"></i> <span>Validasi Mapel</span></div>
        <div class="nav-item" onclick="changeTab('laporan')"><i class="fas fa-file-pdf"></i> <span>Laporan PDF</span></div>
    </div>
    <div class="main-content" id="mainContent"></div>
</div>

<!-- MODAL TAMBAH SANTRI MASAL - FLEKSIBEL -->
<div id="modalSantri" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 20px;"><i class="fas fa-plus-circle"></i> Tambah Santri Masal</h3>
        <div class="form-group">
            <label>Format Input (Nama, Kelas)</label>
            <textarea id="modalNamaKelas" rows="8" placeholder="Contoh:&#10;Ahmad Faiz, Kelas 1&#10;Fatimah Zahra, Kelas 1&#10;Muhammad Rizki, Kelas 2&#10;Aisyah Nurul, Kelas 3&#10;&#10;📌 Format: Nama, Kelas&#10;📌 Bisa pakai koma atau pipe (|)&#10;📌 Kelas bebas (Kelas 1, Kelas A, Kelas Unggulan, dll)"></textarea>
            <small style="color: #666; display: block; margin-top: 5px;">
                <i class="fas fa-info-circle"></i> Format: <strong>Nama, Kelas</strong> atau <strong>Nama | Kelas</strong><br>
                Kelas akan otomatis terkelompokkan sesuai input (bebas tanpa batasan)
            </small>
        </div>
        <div class="form-group" style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn-secondary" onclick="closeModal()">Batal</button>
            <button class="btn-primary" onclick="tambahSantriMasal()">Simpan & Kelompokkan</button>
        </div>
    </div>
</div>

<!-- MODAL VALIDASI SANTRI -->
<div id="modalValidasiSantri" class="modal">
    <div class="modal-content" style="max-width: 550px;">
        <h3 id="validasiSantriNama" style="margin-bottom: 15px;"><i class="fas fa-user-graduate"></i> Validasi Mapel</h3>
        <p id="validasiSantriKelas" style="margin-bottom: 15px; color: #666;"></p>
        <div id="validasiMapelList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 20px;"></div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn-secondary" onclick="closeModalValidasi()">Tutup</button>
            <button class="btn-primary" onclick="simpanValidasiSantri()">Simpan Validasi</button>
        </div>
    </div>
</div>

<script>
    // DATA SANTRI AWAL
    let santriData = [
        { id: 1, nama: "Ahmad Faiz bin Abdullah", kelas: "Kelas 1", status: "Belum" },
        { id: 2, nama: "Fatimah Zahra binti Yusuf", kelas: "Kelas 1", status: "Belum" },
        { id: 3, nama: "Muhammad Rizki al-Ghifari", kelas: "Kelas 2", status: "Belum" },
        { id: 4, nama: "Aisyah Nurul Hidayah", kelas: "Kelas 2", status: "Belum" },
        { id: 5, nama: "Umar Faruq bin Hasan", kelas: "Kelas 3", status: "Belum" },
        { id: 6, nama: "Khadijah binti Umar", kelas: "Kelas 3", status: "Belum" }
    ];

    // MAPEL PER KELAS - BISA DIKEMBANGKAN SESUAI KEBUTUHAN
    const defaultMapel = ["Akhlak", "B. Arab", "Fikih", "Hadits", "Nahwu", "Shorof", "Tajwid", "Tauhid"];
    
    let mapelPerKelas = {
        "Kelas 1": [...defaultMapel],
        "Kelas 2": [...defaultMapel],
        "Kelas 3": [...defaultMapel]
    };

    // Fungsi untuk menambahkan kelas baru ke mapelPerKelas jika belum ada
    function ensureKelasInMapel(kelas) {
        if (!mapelPerKelas[kelas]) {
            mapelPerKelas[kelas] = [...defaultMapel];
        }
        if (!validasiStatus[kelas]) {
            validasiStatus[kelas] = {};
            mapelPerKelas[kelas].forEach(mapel => {
                validasiStatus[kelas][mapel] = false;
            });
        }
    }

    let validasiStatus = {};
    
    function initValidasi() {
        for (let kelas in mapelPerKelas) {
            if (!validasiStatus[kelas]) validasiStatus[kelas] = {};
            mapelPerKelas[kelas].forEach(mapel => { validasiStatus[kelas][mapel] = validasiStatus[kelas][mapel] || false; });
        }
    }
    initValidasi();

    let currentValidasiSantriId = null;
    let chartInstance = null;

    function updateStatusSantri() {
        santriData.forEach(santri => {
            const mapels = mapelPerKelas[santri.kelas];
            if (mapels && mapels.length > 0) {
                const allComplete = mapels.every(mapel => validasiStatus[santri.kelas]?.[mapel] === true);
                santri.status = allComplete ? "Selesai" : "Belum";
            } else {
                santri.status = "Belum";
            }
        });
    }

    function getStats() {
        updateStatusSantri();
        const total = santriData.length;
        const selesai = santriData.filter(s => s.status === "Selesai").length;
        const belum = total - selesai;
        return { total, selesai, belum, persenSelesai: total > 0 ? ((selesai / total) * 100).toFixed(1) : 0 };
    }

    // Kelompokkan santri berdasarkan kelas untuk tampilan
    function getGroupedSantri() {
        const grouped = {};
        santriData.forEach(s => {
            if (!grouped[s.kelas]) grouped[s.kelas] = [];
            grouped[s.kelas].push(s);
        });
        return grouped;
    }

    function renderDashboard() {
        const now = new Date();
        const hari = now.toLocaleDateString('id-ID', { weekday: 'long' });
        const tanggal = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        const jam = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const { total, selesai, belum, persenSelesai } = getStats();
        
        const html = `
            <div class="welcome-card">
                <div class="datetime"><i class="far fa-calendar-alt"></i> ${hari}, ${tanggal} | <i class="far fa-clock"></i> ${jam}</div>
                <h2 style="margin-top: 15px; color: #1a5c3a;">📖 Selamat datang di Tam-taman</h2>
                <p style="color: #6b8c7a;">Validasi Syarat Keikutsertaan Ujian - Madrasah Diniyah</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"><div class="icon"><i class="fas fa-user-graduate"></i></div><h3>${total}</h3><p>Total Santri</p></div>
                <div class="stat-card" style="background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);"><div class="icon"><i class="fas fa-check-circle"></i></div><h3>${selesai}</h3><p>Selesai</p></div>
                <div class="stat-card" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);"><div class="icon"><i class="fas fa-spinner"></i></div><h3>0</h3><p>Dalam Proses</p></div>
                <div class="stat-card" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);"><div class="icon"><i class="fas fa-hourglass"></i></div><h3>${belum}</h3><p>Belum</p></div>
            </div>
            <div class="chart-container">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-chart-pie"></i> Grafik Persentasi Kelulusan</h3>
                <canvas id="statusChart"></canvas>
                <div style="text-align: center; margin-top: 20px;">
                    <div style="display: inline-block; padding: 12px 25px; background: linear-gradient(135deg, #27ae60, #1e8449); border-radius: 40px; color: white;">
                        <strong>📊 Persentase Selesai: ${persenSelesai}%</strong>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('mainContent').innerHTML = html;
        
        const ctx = document.getElementById('statusChart')?.getContext('2d');
        if (ctx) {
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Selesai', 'Belum'], datasets: [{ data: [selesai, belum], backgroundColor: ['#27ae60', '#e74c3c'], borderWidth: 0 }] },
                options: { responsive: true, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw} santri (${((ctx.raw/total)*100).toFixed(1)}%)` } } } }
            });
        }
    }

    function renderDataSantri() {
        updateStatusSantri();
        const grouped = getGroupedSantri();
        let html = `
            <div class="data-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                    <h2><i class="fas fa-users"></i> Data Santri</h2>
                    <button class="btn-primary" onclick="openModalTambah()"><i class="fas fa-plus"></i> Tambah Masal</button>
                </div>
        `;
        
        for (const [kelas, santris] of Object.entries(grouped).sort()) {
            html += `
                <div style="margin-top: 20px;">
                    <h3 style="color: #1a5c3a; margin-bottom: 10px;"><i class="fas fa-chalkboard"></i> ${kelas}</h3>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>ID</th><th>Nama Santri</th><th>Status</th><th>Aksi</th></tr></thead>
                            <tbody>
                                ${santris.map(s => `
                                    <tr>
                                        <td>${s.id}</td>
                                        <td><i class="fas fa-user-circle"></i> ${s.nama}</td>
                                        <td><span class="status-badge ${s.status === 'Selesai' ? 'status-selesai' : 'status-belum'}">${s.status}</span></td>
                                        <td><button class="btn-warning" onclick="editSantri(${s.id})"><i class="fas fa-edit"></i></button> <button class="btn-danger" onclick="hapusSantri(${s.id})"><i class="fas fa-trash"></i></button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        html += `</div>`;
        document.getElementById('mainContent').innerHTML = html;
    }

    function openModalTambah() { document.getElementById('modalSantri').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalSantri').style.display = 'none'; document.getElementById('modalNamaKelas').value = ''; }

    function tambahSantriMasal() {
        const text = document.getElementById('modalNamaKelas').value;
        const lines = text.split('\n').filter(l => l.trim());
        let added = 0;
        let maxId = Math.max(...santriData.map(s => s.id), 0);
        
        lines.forEach(line => {
            let nama = "", kelas = "";
            // Coba split dengan koma dulu, lalu pipe
            if (line.includes(',')) {
                const parts = line.split(',').map(p => p.trim());
                nama = parts[0];
                kelas = parts.slice(1).join(',').trim();
            } else if (line.includes('|')) {
                const parts = line.split('|').map(p => p.trim());
                nama = parts[0];
                kelas = parts.slice(1).join('|').trim();
            }
            
            if (nama && kelas) {
                maxId++;
                // Pastikan kelas terdaftar di mapelPerKelas
                ensureKelasInMapel(kelas);
                santriData.push({ id: maxId, nama: nama, kelas: kelas, status: "Belum" });
                added++;
            }
        });
        
        closeModal();
        if (added > 0) {
            alert(`✅ Berhasil menambahkan ${added} santri!\nKelas baru akan otomatis terdaftar.`);
            renderDataSantri();
            if (document.querySelector('.nav-item.active')?.innerText.includes('Dashboard')) renderDashboard();
        } else {
            alert("Format salah! Gunakan: Nama, Kelas atau Nama | Kelas");
        }
    }

    function editSantri(id) {
        const santri = santriData.find(s => s.id === id);
        const namaBaru = prompt("Edit Nama Santri:", santri.nama);
        if (namaBaru && namaBaru.trim()) { santri.nama = namaBaru.trim(); renderDataSantri(); if (document.querySelector('.nav-item.active')?.innerText.includes('Dashboard')) renderDashboard(); }
    }

    function hapusSantri(id) {
        if (confirm("Yakin hapus santri ini?")) { santriData = santriData.filter(s => s.id !== id); renderDataSantri(); if (document.querySelector('.nav-item.active')?.innerText.includes('Dashboard')) renderDashboard(); }
    }

    function openValidasiSantri(santriId) {
        currentValidasiSantriId = santriId;
        const santri = santriData.find(s => s.id === santriId);
        ensureKelasInMapel(santri.kelas);
        document.getElementById('validasiSantriNama').innerHTML = `<i class="fas fa-user-graduate"></i> ${santri.nama}`;
        document.getElementById('validasiSantriKelas').innerHTML = `Kelas: ${santri.kelas}`;
        
        const mapels = mapelPerKelas[santri.kelas];
        const container = document.getElementById('validasiMapelList');
        container.innerHTML = mapels.map(mapel => `
            <label class="mapel-check" style="background: ${validasiStatus[santri.kelas]?.[mapel] ? '#d4edda' : '#f8faf8'}">
                <input type="checkbox" data-mapel="${mapel}" ${validasiStatus[santri.kelas]?.[mapel] ? 'checked' : ''}> ${mapel}
            </label>
        `).join('');
        
        document.getElementById('modalValidasiSantri').style.display = 'flex';
    }

    function closeModalValidasi() { document.getElementById('modalValidasiSantri').style.display = 'none'; currentValidasiSantriId = null; }

    function simpanValidasiSantri() {
        if (!currentValidasiSantriId) return;
        const santri = santriData.find(s => s.id === currentValidasiSantriId);
        const checkboxes = document.querySelectorAll('#validasiMapelList input[type="checkbox"]');
        const mapels = mapelPerKelas[santri.kelas];
        checkboxes.forEach((cb, idx) => { validasiStatus[santri.kelas][mapels[idx]] = cb.checked; });
        
        updateStatusSantri();
        closeModalValidasi();
        alert(`✅ Validasi mapel untuk ${santri.nama} telah disimpan!\nStatus: ${santri.status}`);
        renderValidasiMapel();
        if (document.querySelector('.nav-item.active')?.innerText.includes('Dashboard')) renderDashboard();
    }

    function renderValidasiMapel() {
        updateStatusSantri();
        const grouped = getGroupedSantri();
        let html = `<div class="kelas-container"><h2><i class="fas fa-check-double"></i> Validasi Syarat Ujian</h2><p style="margin-bottom:15px;">✨ Klik nama santri untuk memvalidasi mapel secara individu</p>`;
        
        for (const [kelas, santriKelas] of Object.entries(grouped).sort()) {
            ensureKelasInMapel(kelas);
            html += `
                <div style="margin-top: 25px; border-top: 2px solid #eef2ef; padding-top: 20px;">
                    <div class="kelas-header">
                        <div class="kelas-title"><i class="fas fa-chalkboard"></i> ${kelas} (${santriKelas.length} santri)</div>
                        <div><button class="btn-secondary" onclick="selectAllMapelKelas('${kelas}', true)">✓ Centang Semua Mapel</button> <button class="btn-secondary" onclick="selectAllMapelKelas('${kelas}', false)">✗ Hapus Semua</button></div>
                    </div>
                    <div class="mapel-grid" id="grid-${kelas.replace(/[^a-zA-Z0-9]/g, '_')}">
                        ${mapelPerKelas[kelas].map(mapel => `<label class="mapel-check"><input type="checkbox" data-kelas="${kelas}" data-mapel="${mapel}" ${validasiStatus[kelas]?.[mapel] ? 'checked' : ''}> ${mapel}</label>`).join('')}
                    </div>
                    <input type="text" id="search-${kelas.replace(/[^a-zA-Z0-9]/g, '_')}" class="search-input" placeholder="🔍 Cari nama santri...">
                    <div id="santri-list-${kelas.replace(/[^a-zA-Z0-9]/g, '_')}">
                        ${santriKelas.map(s => `<div class="santri-item" onclick="openValidasiSantri(${s.id})"><span class="santri-name"><i class="fas fa-user"></i> ${s.nama}</span><span class="status-badge ${s.status === 'Selesai' ? 'status-selesai' : 'status-belum'}">${s.status}</span></div>`).join('')}
                    </div>
                    <button class="btn-primary" style="margin-top: 15px;" onclick="simpanValidasiKelas('${kelas}')"><i class="fas fa-save"></i> Simpan Validasi ${kelas}</button>
                </div>
            `;
        }
        html += `</div>`;
        document.getElementById('mainContent').innerHTML = html;
        
        for (const [kelas] of Object.entries(grouped)) {
            const safeKelas = kelas.replace(/[^a-zA-Z0-9]/g, '_');
            const inputSearch = document.getElementById(`search-${safeKelas}`);
            if (inputSearch) {
                inputSearch.addEventListener('input', function(e) {
                    const keyword = e.target.value.toLowerCase();
                    const santriFilter = santriData.filter(s => s.kelas === kelas && s.nama.toLowerCase().includes(keyword));
                    const container = document.getElementById(`santri-list-${safeKelas}`);
                    if (container) {
                        container.innerHTML = santriFilter.map(s => `<div class="santri-item" onclick="openValidasiSantri(${s.id})"><span class="santri-name"><i class="fas fa-user"></i> ${s.nama}</span><span class="status-badge ${s.status === 'Selesai' ? 'status-selesai' : 'status-belum'}">${s.status}</span></div>`).join('') || '<div style="padding: 10px; color: gray;">Tidak ditemukan</div>';
                    }
                });
            }
        }
        
        document.querySelectorAll('.mapel-check input').forEach(cb => {
            cb.addEventListener('change', function() {
                const kelas = this.dataset.kelas;
                const mapel = this.dataset.mapel;
                if (!validasiStatus[kelas]) validasiStatus[kelas] = {};
                validasiStatus[kelas][mapel] = this.checked;
            });
        });
    }

    window.selectAllMapelKelas = function(kelas, checked) {
        ensureKelasInMapel(kelas);
        mapelPerKelas[kelas].forEach(mapel => { validasiStatus[kelas][mapel] = checked; });
        const safeKelas = kelas.replace(/[^a-zA-Z0-9]/g, '_');
        const container = document.getElementById(`grid-${safeKelas}`);
        if (container) container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checked);
    };

    window.simpanValidasiKelas = function(kelas) {
        updateStatusSantri();
        const { selesai, total } = getStats();
        alert(`✅ Validasi ${kelas} disimpan!\nSelesai: ${selesai}/${total} santri`);
        renderValidasiMapel();
        if (document.querySelector('.nav-item.active')?.innerText.includes('Dashboard')) renderDashboard();
    };

    function renderLaporan() {
        updateStatusSantri();
        const { total, selesai, belum, persenSelesai } = getStats();
        const tanggal = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const html = `
            <div class="data-card">
                <div style="text-align: center; margin-bottom: 20px;"><button class="btn-primary" onclick="downloadPDF()" style="background:#dc3545;"><i class="fas fa-file-pdf"></i> Unduh Laporan PDF Lengkap</button></div>
                <div id="laporanContent">
                    <div style="text-align: center; margin-bottom: 30px;"><h1 style="color:#1a5c3a;"><i class="fas fa-book-quran"></i> Tam-taman</h1><h3>LAPORAN VALIDASI SYARAT UJIAN</h3><p>Madrasah Diniyah</p><p>Tanggal Cetak: ${tanggal}</p></div>
                    <div style="background:#f0faf4; padding:20px; border-radius:16px; margin-bottom:25px;"><h3>Ringkasan Data</h3><table style="width:100%"><tr><td><strong>Total Santri</strong></td><td>: ${total} orang</td></tr><tr><td><strong>Selesai</strong></td><td style="color:green;">: ${selesai} orang (${persenSelesai}%)</td></tr><tr><td><strong>Belum</strong></td><td style="color:red;">: ${belum} orang (${(100-persenSelesai).toFixed(1)}%)</td></tr></table></div>
                    <h3>Detail Data Santri</h3><table style="width:100%; border-collapse:collapse; border:1px solid #ddd;"><thead><tr style="background:#27ae60; color:white;"><th>No</th><th>Nama Santri</th><th>Kelas</th><th>Status</th></tr></thead><tbody>
                        ${santriData.map((s,i) => `<tr><td style="border:1px solid #ddd; padding:8px;">${i+1}</td><td style="border:1px solid #ddd; padding:8px;">${s.nama}</td><td style="border:1px solid #ddd; padding:8px;">${s.kelas}</td><td style="border:1px solid #ddd; padding:8px;">${s.status}</td></tr>`).join('')}
                    </tbody></table>
                </div>
            </div>
        `;
        document.getElementById('mainContent').innerHTML = html;
    }

    window.downloadPDF = function() {
        const element = document.getElementById('laporanContent');
        html2pdf().set({ margin: [0.5,0.5,0.5,0.5], filename: `Laporan_Tam-taman_${new Date().toISOString().slice(0,19)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } }).from(element).save();
    };

    window.changeTab = function(tab) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        if (tab === 'dashboard') renderDashboard();
        else if (tab === 'santri') renderDataSantri();
        else if (tab === 'validasi') renderValidasiMapel();
        else if (tab === 'laporan') renderLaporan();
    };

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    function login() {
        if (document.getElementById('username').value && document.getElementById('password').value) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            renderDashboard();
        } else alert('Masukkan username & password');
    }

    window.openModalTambah = openModalTambah;
    window.closeModal = closeModal;
    window.tambahSantriMasal = tambahSantriMasal;
    window.editSantri = editSantri;
    window.hapusSantri = hapusSantri;
    window.openValidasiSantri = openValidasiSantri;
    window.closeModalValidasi = closeModalValidasi;
    window.simpanValidasiSantri = simpanValidasiSantri;
    window.toggleSidebar = toggleSidebar;
</script>
</body>
</html>
