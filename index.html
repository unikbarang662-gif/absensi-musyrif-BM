<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tam-taman | Validasi Syarat Keikutsertaan Ujian</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #eef5e8;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- LOGIN PAGE ---------- */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c2c, #2b5e3b);
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(2px);
            padding: 40px 35px;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            width: 380px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .login-card h2 {
            color: #1e562e;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .login-card p {
            color: #4a6a3b;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            font-weight: 600;
            color: #2c5e2e;
            display: block;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1px solid #c8e0c0;
            background: #f9fff7;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.2);
        }
        .login-btn {
            background: #2b6e3c;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #1e562e;
            transform: scale(1.02);
        }
        /* ---------- MAIN APP (hidden by default) ---------- */
        .app-wrapper {
            display: none;
            height: 100vh;
            overflow: hidden;
        }
        /* sidebar + main layout */
        .dashboard-layout {
            display: flex;
            height: 100%;
        }
        /* sidebar stylish */
        .sidebar {
            width: 280px;
            background: #1f3f2c;
            color: #f0f7ea;
            display: flex;
            flex-direction: column;
            padding: 25px 0 20px 0;
            box-shadow: 4px 0 12px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        .logo-area {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #3c6e47;
            margin-bottom: 20px;
        }
        .logo-area h3 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #e9f5e3;
        }
        .logo-area p {
            font-size: 12px;
            opacity: 0.8;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .nav-item i {
            width: 24px;
            font-size: 1.2rem;
        }
        .nav-item.active, .nav-item:hover {
            background: #2f6b41;
            color: white;
        }
        /* main content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: #f4faf0;
            padding: 20px 28px;
        }
        /* header welcome */
        .welcome-card {
            background: white;
            border-radius: 28px;
            padding: 20px 28px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .datetime {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4e6c3, #b3d9a0);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            color: #1e4620;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            border-radius: 28px;
            padding: 20px;
            text-align: center;
            color: #1e2f1a;
            font-weight: bold;
            box-shadow: 0 8px 12px rgba(0,0,0,0.05);
        }
        .stat-card h3 { font-size: 2rem; margin-bottom: 8px; }
        .chart-container {
            background: white;
            border-radius: 28px;
            padding: 18px;
            margin-bottom: 30px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
        }
        canvas { max-height: 260px; width: 100%; }
        /* kelas section */
        .kelas-section {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-top: 10px;
        }
        .kelas-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 20px 0 12px 0;
            color: #27632e;
        }
        .mapel-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
            align-items: center;
        }
        .mapel-check {
            background: #eef5e9;
            padding: 8px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .btn-save-kelas {
            background: #2e6b3c;
            border: none;
            color: white;
            padding: 8px 28px;
            border-radius: 60px;
            cursor: pointer;
            margin: 15px 0;
            font-weight: bold;
        }
        .btn-select-all {
            background: #b3cf9b;
            border: none;
            padding: 6px 20px;
            border-radius: 30px;
            margin-right: 15px;
            cursor: pointer;
            font-weight: 600;
        }
        .laporan-btn {
            background: #1f5932;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        footer { text-align: center; margin-top: 20px; font-size: 12px; color: #6c8b6a; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        hr { margin: 16px 0; }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-container">
    <div class="login-card">
        <h2>🌿 Tam-taman</h2>
        <p>Validasi Syarat Keikutsertaan Ujian</p>
        <div class="input-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input type="text" id="loginUser" placeholder="admin">
        </div>
        <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="loginPass" placeholder="••••••">
        </div>
        <button class="login-btn" onclick="doLogin()">Masuk Dashboard <i class="fas fa-arrow-right"></i></button>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="app-wrapper">
    <div class="dashboard-layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo-area">
                <h3><i class="fas fa-seedling"></i> Tam-taman</h3>
                <p>Verifikasi Ujian Santri</p>
            </div>
            <div class="nav-item active" data-tab="dashboard">
                <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
            </div>
            <div class="nav-item" data-tab="datasantri">
                <i class="fas fa-users"></i> <span>Data Santri</span>
            </div>
            <div class="nav-item" data-tab="mapel">
                <i class="fas fa-book-open"></i> <span>Mapel per Kelas</span>
            </div>
            <div class="nav-item" data-tab="laporan">
                <i class="fas fa-file-alt"></i> <span>Laporan PDF</span>
            </div>
        </div>

        <!-- MAIN DASHBOARD AREA -->
        <div class="main-content" id="mainContent">
            <!-- konten dinamis via JS -->
        </div>
    </div>
</div>

<script>
    // ---------- DATA MOCK SANTRI ----------
    let totalSantri = 145;
    let selesaiCount = 0;      // dari validasi centang tersimpan
    let dalamProses = 0;
    let belumCount = totalSantri;

    // struktur penyimpanan validasi: key = "Kelas X - mapel" per siswa? Karena syarat keikutsertaan per mapel,
    // lebih sederhana: tiap santri memiliki array progress, namun pada demo kita simpan persetujuan mapel secara kolektif.
    // Untuk kebutuhan tampilan total "Selesai" secara otomatis jika semua mapel kelas tertentu dicentang per santri.
    // Namun agar aplikasi fungsional: kita buat object "kelasValidation" menyimpan status centang tiap mapel di tiap kelas.
    // lalu hitung jumlah santri yang telah memenuhi semua mapel berdasarkan kelas.
    // karena data santri punya kelas masing-masing, kita perlu mapping santri dengan kelasnya.
    let santriList = [
        { nama: "Ahmad Zaki", kelas: "Kelas 1", status: "Belum" }, { nama: "Fatimah Azzahra", kelas: "Kelas 1", status: "Belum" },
        { nama: "Yusuf Rahman", kelas: "Kelas 2", status: "Belum" }, { nama: "Maryam Hasanah", kelas: "Kelas 2", status: "Belum" },
        { nama: "Umar Khair", kelas: "Kelas 3", status: "Belum" }, { nama: "Aisyah Putri", kelas: "Kelas 3", status: "Belum" },
        { nama: "Hamzah Al-Ghifari", kelas: "Kelas 4A", status: "Belum" },{ nama: "Sofiyah Nur", kelas: "Kelas 4A", status: "Belum" },
        { nama: "Ibrahim Luthfi", kelas: "Kelas 4B", status: "Belum" },{ nama: "Hafshah", kelas: "Kelas 4B", status: "Belum" },
        { nama: "Zaid bin Tsabit", kelas: "Kelas 5A", status: "Belum" },{ nama: "Ruqayyah", kelas: "Kelas 5A", status: "Belum" },
        { nama: "Sa'ad bin Abi", kelas: "Kelas 5B", status: "Belum" },{ nama: "Khadijah", kelas: "Kelas 5B", status: "Belum" },
        { nama: "Bilal bin Rabbah", kelas: "Kelas 6A", status: "Belum" },{ nama: "Sumayyah", kelas: "Kelas 6A", status: "Belum" },
        { nama: "Abu Bakar", kelas: "Kelas 6B", status: "Belum" },{ nama: "Ummu Kultsum", kelas: "Kelas 6B", status: "Belum" }
    ];
    // untuk demo 18 santri total, totalSantri=18, selesaiCount diupdate
    
    // data master mapel tiap kelas sesuai permintaan
    const masterMapel = {
        "Kelas 1": ["Akhlak","B. Arab","Fikih","Hadits","Nahwu","Shorof","Tajwid","Tauhid"],
        "Kelas 2": ["Akhlak","B. Arab","Fikih","Hadits","Nahwu","Shorof","Siroh","Tauhid"],
        "Kelas 3": ["Akhlak","B. Arab","Fikih","Hadits","Nahwu","Shorof","Siroh","Tauhid"],
        "Kelas 4A": ["B. Arab","Balaghoh","Fikih","Mustholah H","Nahwu","Qowaid F","Ushul F"],
        "Kelas 4B": ["Akhlak","B. Arab","Fikih","Hadits","Nahwu","Siroh","Tauhid"],
        "Kelas 5A": ["B. Arab","Balaghoh","Faroid","Fikih","Mustholah H","Nahwu","Qowaid F","Ushul F"],
        "Kelas 5B": ["Akhlak","B. Arab","Faroid","Fikih","Hadits","Mustholah H","Nahwu","Qowaid F","Siroh","Tafsir","Ushul Fikih"],
        "Kelas 6A": ["B. Arab","Balaghoh","Faroid","Fikih","Hadits","Mustholah H","Nahwu","Qowaid F","Tafsir","Ushul F"],
        "Kelas 6B": ["Akhlak","B. Arab","Balaghoh","Faroid","Fikih","Hadits","Mustholah H","Qowaid F","Tafsir","Ushul F","Nahwu"]
    };
    
    // object status centang per kelas & mapel: { "Kelas 1": { "Akhlak": true, ... } }
    let validationStatus = {};
    // inisialisasi semua false
    function initValidation() {
        for (let kelas in masterMapel) {
            if (!validationStatus[kelas]) validationStatus[kelas] = {};
            masterMapel[kelas].forEach(mapel => {
                if (validationStatus[kelas][mapel] === undefined) validationStatus[kelas][mapel] = false;
            });
        }
    }
    initValidation();
    
    // hitung ulang selesai, proses, belum berdasarkan santri dan status kelulusan seluruh mapel per kelas
    function recalcProgress() {
        // syarat selesai: semua mapel di kelasnya sudah dicentang true
        let finished = 0;
        santriList.forEach(s => {
            const kelas = s.kelas;
            const requiredMapels = masterMapel[kelas];
            if (!requiredMapels) return;
            const allChecked = requiredMapels.every(mapel => validationStatus[kelas]?.[mapel] === true);
            if (allChecked) {
                s.status = "Selesai";
                finished++;
            } else {
                s.status = "Belum";
            }
        });
        selesaiCount = finished;
        belumCount = santriList.length - selesaiCount;
        dalamProses = 0; // sederhana: tidak ada intermediate, bisa dimasukkan 0
        // update UI jika dashboard aktif
        updateDashboardStats();
        updateChart();
    }
    
    // Fungsi simpan centang (per kelas) update status & recalc
    function saveValidationForClass(kelas) {
        // validationStatus sudah terikat dengan checkbox event
        recalcProgress();
        alert(`✅ Validasi untuk ${kelas} disimpan. Status kelulusan diperbarui.`);
        renderMapelPage(); // refresh tampilan mapel
        if (document.querySelector('.nav-item.active')?.dataset.tab === 'dashboard') renderDashboard();
    }
    
    function setAllMapelInClass(kelas, checked) {
        const mapels = masterMapel[kelas];
        mapels.forEach(m => { validationStatus[kelas][m] = checked; });
        // re-render kelas yang bersangkutan
        renderMapelPage();
    }
    
    // ---------- RENDER FUNCTIONS ----------
    function renderDashboard() {
        const container = document.getElementById('mainContent');
        const now = new Date();
        const hari = now.toLocaleDateString('id-ID', { weekday: 'long' });
        const tanggal = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        const jam = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second:'2-digit' });
        container.innerHTML = `
            <div class="welcome-card">
                <div class="flex-between"><span class="datetime"><i class="far fa-calendar-alt"></i> ${hari}, ${tanggal} | 🕒 ${jam}</span></div>
                <h2 style="margin-top: 15px; color:#2b5938;">🌱 Selamat datang, Admin Tam-taman</h2>
                <p>Validasi kelulusan syarat ujian santri</p>
            </div>
            <div class="stats-grid" id="statsGrid"></div>
            <div class="chart-container">
                <h3><i class="fas fa-chart-pie"></i> Persentase Kelulusan Syarat Ujian</h3>
                <canvas id="progressChart" width="400" height="200"></canvas>
            </div>
        `;
        updateDashboardStats();
        initChart();
    }
    
    function updateDashboardStats() {
        const grid = document.getElementById('statsGrid');
        if(!grid) return;
        grid.innerHTML = `
            <div class="stat-card" style="background:#c8e6d9;"><i class="fas fa-users fa-2x"></i><h3>${totalSantri}</h3><p>Total Santri</p></div>
            <div class="stat-card" style="background:#b9f6ca;"><i class="fas fa-check-circle"></i><h3>${selesaiCount}</h3><p>Selesai ✅</p></div>
            <div class="stat-card" style="background:#ffe0b5;"><i class="fas fa-spinner"></i><h3>${dalamProses}</h3><p>Dalam Proses</p></div>
            <div class="stat-card" style="background:#ffcdd2;"><i class="fas fa-hourglass-half"></i><h3>${belumCount}</h3><p>Belum</p></div>
        `;
    }
    
    let chartInstance;
    function initChart() {
        const ctx = document.getElementById('progressChart')?.getContext('2d');
        if(!ctx) return;
        if(chartInstance) chartInstance.destroy();
        const persenSelesai = ((selesaiCount/totalSantri)*100).toFixed(1);
        const persenBelum = ((belumCount/totalSantri)*100).toFixed(1);
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: [`Selesai (${persenSelesai}%)`, `Belum (${persenBelum}%)`], datasets: [{ data: [selesaiCount, belumCount], backgroundColor: ['#4caf50','#ff8a65'], borderWidth: 0 }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
    }
    function updateChart() { if(chartInstance){ chartInstance.data.datasets[0].data = [selesaiCount, belumCount]; chartInstance.update();} else initChart();}
    
    function renderDataSantri() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `<div class="kelas-section"><h2><i class="fas fa-users"></i> Data Santri & Status Kelulusan</h2><table style="width:100%; border-collapse:collapse;"><thead><tr style="background:#dcedbc;"><th>Nama</th><th>Kelas</th><th>Status</th></tr></thead><tbody>
            ${santriList.map(s => `<tr><td>${s.nama}</td><td>${s.kelas}</td><td style="color:${s.status==='Selesai'?'green':'orange'}"><b>${s.status}</b></td></tr>`).join('')}
        </tbody></table><hr><p><i class="fas fa-info-circle"></i> Status "Selesai" otomatis jika semua mapel di kelasnya telah dicentang & disimpan.</p></div>`;
    }
    
    function renderMapelPage() {
        let html = `<div class="kelas-section"><h2><i class="fas fa-chalkboard-teacher"></i> Validasi Syarat Ujian per Kelas</h2><p>Centang mapel yang telah tuntas, lalu klik SIMPAN per kelas.</p>`;
        for (let kelas in masterMapel) {
            const mapels = masterMapel[kelas];
            html += `<div style="margin-bottom: 28px; border-bottom:1px solid #cde0cd; padding-bottom:18px;">
                        <h3 class="kelas-title">📘 ${kelas}</h3>
                        <div class="mapel-grid" id="grid-${kelas.replace(/\s/g,'')}">`;
            mapels.forEach(mapel => {
                const isChecked = validationStatus[kelas]?.[mapel] || false;
                html += `<label class="mapel-check"><input type="checkbox" data-kelas="${kelas}" data-mapel="${mapel}" ${isChecked ? 'checked' : ''}> ${mapel}</label>`;
            });
            html += `</div><div><button class="btn-select-all" onclick="setAllMapelInClass('${kelas}', true)">✅ Centang Semua</button>
                     <button class="btn-select-all" style="background:#e0cfb1;" onclick="setAllMapelInClass('${kelas}', false)">⬜ Hapus Semua</button>
                     <button class="btn-save-kelas" onclick="saveValidationForClass('${kelas}')"><i class="fas fa-save"></i> Simpan ${kelas}</button></div></div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
        // attach event listeners untuk checkbox individu
        document.querySelectorAll('.mapel-check input').forEach(chk => {
            chk.addEventListener('change', (e) => {
                const kelas = e.target.dataset.kelas;
                const mapel = e.target.dataset.mapel;
                validationStatus[kelas][mapel] = e.target.checked;
                // tidak langsung recalc sampai simpan
            });
        });
    }
    
    function generateLaporanHTML() {
        let rows = '';
        santriList.forEach(s => {
            let semuaCentang = masterMapel[s.kelas]?.every(m => validationStatus[s.kelas]?.[m] === true);
            rows += `<tr><td>${s.nama}</td><td>${s.kelas}</td><td>${semuaCentang ? '✅ SELESAI' : '❌ BELUM'}</td></tr>`;
        });
        const dateNow = new Date().toLocaleString('id-ID');
        return `
        <html><head><meta charset="UTF-8"><title>Laporan Tam-taman</title><style>body{font-family:Inter, sans-serif; padding:30px} h2{color:#2b6e3c} table{border-collapse:collapse; width:100%} th,td{border:1px solid #aaa; padding:8px; text-align:left} th{background:#c8e6d9}</style></head>
        <body><h2>🌿 Tam-taman - Laporan Validasi Syarat Ujian</h2><p>Tanggal Cetak: ${dateNow}</p><p>Total Santri: ${totalSantri} | Selesai: ${selesaiCount} | Belum: ${belumCount}</p>
        <table><thead><tr><th>Nama Santri</th><th>Kelas</th><th>Status Kelulusan Syarat</th></tr></thead><tbody>${rows}</tbody></table>
        <p><i>*Selesai = semua mapel di kelasnya telah divalidasi centang semua dan disimpan.</i></p></body></html>`;
    }
    
    function renderLaporanPage() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `<div class="kelas-section"><h2><i class="fas fa-download"></i> Cetak Laporan PDF</h2>
        <button class="laporan-btn" id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> Unduh Laporan PDF Lengkap</button>
        <div id="pdfPreview" style="background:#fef9e6; border-radius:24px; padding:16px; margin-top:20px; max-height:400px; overflow:auto;">
        ${generateLaporanHTML()}
        </div></div>`;
        document.getElementById('downloadPdfBtn')?.addEventListener('click', () => {
            const element = document.getElementById('pdfPreview');
            const opt = { margin: [0.5,0.5,0.5,0.5], filename: `Laporan_Tam_taman_${new Date().toISOString().slice(0,19)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } };
            html2pdf().set(opt).from(element).save();
        });
    }
    
    // navigation
    function switchTab(tabId) {
        if(tabId === 'dashboard') renderDashboard();
        else if(tabId === 'datasantri') renderDataSantri();
        else if(tabId === 'mapel') renderMapelPage();
        else if(tabId === 'laporan') renderLaporanPage();
    }
    
    // login logic
    function doLogin() {
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;
        if(user && pass) { // sederhana, apapun bisa login
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            renderDashboard();
            attachNavEvents();
            recalcProgress();
        } else alert("Masukkan username & password");
    }
    
    function attachNavEvents() {
        document.querySelectorAll('.nav-item').forEach(nav => {
            nav.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                nav.classList.add('active');
                const tab = nav.dataset.tab;
                switchTab(tab);
            });
        });
    }
    // inisialisasi recalc
    window.setAllMapelInClass = setAllMapelInClass;
    window.saveValidationForClass = saveValidationForClass;
    recalcProgress();
</script>
</body>
</html>
